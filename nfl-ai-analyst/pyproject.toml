[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-ai-analyst"
version = "0.1.0"
description = "NFL game predictions (Elo + points model) with injury and news summaries, run on demand."
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1.5",
  "polars>=1.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "streamlit>=1.38",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
nfl-analyst = "nfl_analyst.cli:main"

[tool.setuptools.packages.find]
include = ["nfl_analyst*"]

[tool.ruff]
line-length = 100
target-version = "py311"
